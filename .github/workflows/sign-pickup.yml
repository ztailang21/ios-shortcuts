name: Sign Pickup Code Shortcut
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate unsigned shortcut
        run: python3 build_pickup_shortcut.py
      - name: Sign with macOS shortcuts CLI
        run: |
          shortcuts sign --mode anyone \
            --input "pickup_unsigned.shortcut" \
            --output "智能取件码.shortcut"
          ls -lh "智能取件码.shortcut"
      - name: Upload signed shortcut artifact
        uses: actions/upload-artifact@v4
        with:
          name: pickup-code-shortcut
          path: 智能取件码.shortcut
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0 -y || true
          gh release create v1.0 "智能取件码.shortcut" --title "智能取件码 v1.0" --notes "Apple-signed iOS Shortcut for Reminders pickup code widget"
